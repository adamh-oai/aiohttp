[package]
name = "aiohttp-rust-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "_rust_client"
path = "src/lib.rs"
crate-type = ["cdylib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
bytes = "1.11.1"
brotli = "8"
flate2 = "1"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
pyo3 = "0.28.3"
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }
rustls = "0.23.38"
rustls-native-certs = "0.8.3"
tokio = { version = "1.52.0", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = "0.26.4"
zstd = "0.13"
